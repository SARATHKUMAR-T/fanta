[package]
name = "fanta"
version = "0.1.0"
description = "Fanta - a local AI companion"
authors = ["Sarath Kumar"]
license = "MIT"
repository = "https://github.com/SARATHKUMAR-T/fanta"
edition = "2021"

[lib]
name = "fanta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
chrono = "0.4"
anyhow = "1"
zbus = "6"
notify-rust = "4"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
rrule = "0.14"
chrono-tz = "0.10"
urlencoding = "2"
iana-time-zone = "0.1"
shell-words = "1"
tokio = { version = "1", features = ["time", "sync", "process", "io-util"] }
whisper-rs = "0.16.0"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Speech recognition is unusably slow unoptimized; build it optimized even in dev.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Smaller, faster release binaries.
[profile.release]
codegen-units = 1
lto = true
strip = true
